<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<meta name="theme-color" content="#b28dff"/>
<title>Meus Pets</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%;overflow:hidden}
body{background:linear-gradient(160deg,#ffd6e8,#fff6b8,#c9f2dc,#cfe8ff,#e7d7ff);font-family:"Comic Sans MS",cursive;touch-action:manipulation}
.scr{position:fixed;inset:0;display:none;align-items:center;justify-content:center}
.scr.active{display:flex}
.stage{position:relative;aspect-ratio:16/9;width:min(100vw,177vh)}
.stage img{width:100%;height:100%;display:block}
.z{position:absolute;background:transparent;border:0;cursor:pointer}
.z:active{filter:brightness(1.15)}
canvas.ov,.fxl,svg.ov{position:absolute;inset:0;pointer-events:none}
canvas.ov{pointer-events:auto;touch-action:none}
#home{position:fixed;top:8px;left:8px;font-size:1.3em;width:50px;height:50px;border-radius:50%;border:3px solid #fff;background:#ff9d5c;z-index:60}
#mus{position:fixed;top:8px;right:8px;font-size:1.3em;width:50px;height:50px;border-radius:50%;border:3px solid #fff;background:#7ed957;z-index:60}
#paw{position:fixed;bottom:8px;right:8px;font-size:1.3em;width:50px;height:50px;border-radius:50%;border:3px solid #fff;background:#ffd23e;z-index:60}
.fx{position:absolute;font-size:2.2em;animation:fl 1.2s ease-out forwards;pointer-events:none}
@keyframes fl{from{transform:translateY(0) scale(.6);opacity:1}to{transform:translateY(-90px) scale(1.5);opacity:0}}
.dot{position:absolute;width:9%;aspect-ratio:1;border-radius:50%;background:#ff8fb1;border:3px solid #fff;color:#fff;font-weight:bold;display:flex;align-items:center;justify-content:center;font-size:1.1em}
.dot.ok{background:#7ed957}
#yay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.45);z-index:99}
#yay.show{display:flex}
.yb{background:#fff;border-radius:28px;padding:24px 40px;text-align:center;border:5px solid #ffd23e}
.ye{font-size:4em;animation:hp 1s infinite}
@keyframes hp{30%{transform:translateY(-20px)}60%{transform:translateY(0)}}
.yb p{font-size:1.4em;color:#e75480;font-weight:bold;margin:8px 0 14px}
.yb button{font-family:inherit;font-size:1.1em;font-weight:bold;padding:12px 22px;border-radius:18px;border:4px solid #fff;background:#7ed957;color:#444}
#dark{position:absolute;inset:0;background:#1a2350;opacity:0;transition:opacity 1s;pointer-events:none;border-radius:8px}
</style>
</head>
<body>
<button id="home" onclick="show('s-menu')">🏠</button>
<button id="mus" onclick="tm()">🔊</button>
<button id="paw" onclick="show('s-pets')">🐾</button>

<div class="scr active" id="s-menu"><div class="stage" id="st-menu"><img src="menu.png"></div></div>
<div class="scr" id="s-pets"><div class="stage" id="st-pets"><img src="pets.png"></div></div>
<div class="scr" id="s-banho"><div class="stage" id="st-banho"><img src="banho.png"><div class="fxl"></div></div></div>
<div class="scr" id="s-spa"><div class="stage" id="st-spa"><img src="spa.png"><div class="fxl"></div></div></div>
<div class="scr" id="s-dormir"><div class="stage" id="st-dormir"><img src="dormir.png"><div id="dark"></div><div class="fxl"></div></div></div>
<div class="scr" id="s-colorir"><div class="stage" id="st-colorir"><img src="colorir.png"><canvas class="ov" id="ccv"></canvas></div></div>
<div class="scr" id="s-sons"><div class="stage" id="st-sons"><img src="sons.png"><div class="fxl"></div><div id="bub" style="position:absolute;top:4%;left:50%;transform:translateX(-50%);background:#fff;border:4px solid #ffd23e;border-radius:20px;padding:6px 22px;font-size:1.5em;font-weight:bold;color:#e75480;display:none"></div></div></div>
<div class="scr" id="s-liga"><div class="stage" id="st-liga"><img src="liga.png"><canvas class="ov" id="lcv" style="pointer-events:none"></canvas><div class="fxl"></div></div></div>

<div id="yay"><div class="yb"><div class="ye">🎉</div><p id="ym">Muito bem!</p><button onclick="hy()">🏠 Menu</button></div></div>

<script>
var $=function(i){return document.getElementById(i)};
function show(id){document.querySelectorAll('.scr').forEach(function(s){s.classList.remove('active')});$(id).classList.add('active');if(id==='s-colorir')requestAnimationFrame(csize);if(id==='s-liga')requestAnimationFrame(lsize)}
function hy(){$('yay').classList.remove('show')}
function yay(m){$('ym').textContent=m;cheer();$('yay').classList.add('show')}
function fx(st,e,x,y){var s=document.createElement('span');s.className='fx';s.textContent=e;s.style.left=x+'%';s.style.top=y+'%';$(st).querySelector('.fxl').appendChild(s);setTimeout(function(){s.remove()},1200)}
/* SOM */
var AC;function ac(){AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC}
function tone(f,d,ty,t,v){d=d||.15;ty=ty||'sine';t=t||0;v=v||.3;var a=ac(),o=a.createOscillator(),g=a.createGain(),n=a.currentTime+t;o.type=ty;o.frequency.value=f;o.connect(g);g.connect(a.destination);g.gain.setValueAtTime(0,n);g.gain.linearRampToValueAtTime(v,n+.02);g.gain.exponentialRampToValueAtTime(.001,n+d);o.start(n);o.stop(n+d+.05)}
function sweep(a,b,d,ty,t){var x=ac(),o=x.createOscillator(),g=x.createGain(),n=x.currentTime+(t||0);o.type=ty||'sine';o.frequency.setValueAtTime(a,n);o.frequency.linearRampToValueAtTime(b,n+d);o.connect(g);g.connect(x.destination);g.gain.setValueAtTime(.3,n);g.gain.exponentialRampToValueAtTime(.001,n+d);o.start(n);o.stop(n+d+.05)}
function pop(){tone(600,.08,'triangle')}
function cheer(){[523,659,784,1047].forEach(function(f,i){tone(f,.2,'triangle',i*.12)})}
function snd(i){if(i===0){sweep(350,180,.15,'square');sweep(300,150,.18,'square',.2)}if(i===1){sweep(500,900,.25,'sawtooth');sweep(900,400,.3,'sawtooth',.28)}if(i===2){tone(900,.06);tone(1100,.06,'sine',.12)}if(i===3){sweep(1200,1800,.1);sweep(1400,2000,.1,'sine',.15)}if(i===4){sweep(1000,1500,.1,'square');sweep(1500,800,.15,'square',.15)}if(i===5){sweep(220,120,.5)}}
/* MÚSICA */
var mOn=true,mT=null,mI=0,mN=0;
var TUNE=[[330,.3],[330,.3],[349,.3],[392,.3],[392,.3],[349,.3],[330,.3],[294,.3],[262,.3],[262,.3],[294,.3],[330,.3],[330,.45],[294,.15],[294,.6],[330,.3],[330,.3],[349,.3],[392,.3],[392,.3],[349,.3],[330,.3],[294,.3],[262,.3],[262,.3],[294,.3],[330,.3],[294,.45],[262,.15],[262,.6]];
function sch(){var a=ac();while(mN<a.currentTime+.6){var n=TUNE[mI%TUNE.length];tone(n[0],n[1]*.9,'triangle',mN-a.currentTime,.09);mN+=n[1];mI++}}
function tm(){mOn=!mOn;$('mus').textContent=mOn?'🔊':'🔇';if(mOn){mN=ac().currentTime+.1;if(!mT)mT=setInterval(sch,200)}else{clearInterval(mT);mT=null}}
/* ZONAS */
function addZ(st,list){list.forEach(function(z){var b=document.createElement('button');b.className='z';b.style.left=z[0]+'%';b.style.top=z[1]+'%';b.style.width=z[2]+'%';b.style.height=z[3]+'%';b.onclick=z[4];$(st).appendChild(b)})}
addZ('st-menu',[[8,37,28,15,function(){show('s-banho');bR()}],[64,37,28,15,function(){show('s-spa');sR()}],[41,38,18,30,function(){show('s-dormir');dR()}],[11,56,27,15,function(){show('s-colorir')}],[62,56,28,15,function(){show('s-colorir')}],[28,77,20,15,function(){show('s-sons')}],[53,77,28,15,function(){show('s-liga');lR()}]]);
addZ('st-pets',[[31,23,18,32,function(){snd(0);hopF()}],[52,22,18,33,function(){snd(1)}],[8,59,19,36,function(){snd(4)}],[30,59,18,36,function(){snd(2)}],[52,59,18,36,function(){snd(3)}],[73,59,19,36,function(){snd(5)}]]);
function hopF(){pop()}
/* BANHO */
var bS=0;function bR(){bS=0}
addZ('st-banho',[[18,76,20,20,function(){if(bS!==0)return;bS=1;for(var i=0;i<5;i++)fx('st-banho','🧼',30+i*9,30+(i%2)*10);sweep(800,400,.2);pop()}],[40,76,20,20,function(){if(bS!==1)return;bS=2;for(var i=0;i<5;i++)fx('st-banho','💦',30+i*9,25+(i%2)*10);sweep(1200,600,.3,'sine');pop()}],[62,76,20,20,function(){if(bS!==2)return;bS=3;for(var i=0;i<6;i++)fx('st-banho','✨',25+i*9,20+(i%3)*12);yay('Banho perfeito!')}]]);
/* SPA */
var sS=0;function sR(){sS=0}
addZ('st-spa',[[5,76,28,17,function(){if(sS!==0)return;sS=1;fx('st-spa','🥒',42,32);fx('st-spa','🥒',52,32);pop()}],[36,76,28,17,function(){if(sS!==1)return;sS=2;for(var i=0;i<4;i++)fx('st-spa','🧴',35+i*9,30+(i%2)*10);sweep(700,900,.2);pop()}],[66,76,28,17,function(){if(sS!==2)return;sS=3;for(var i=0;i<5;i++)fx('st-spa','💗',30+i*9,25+(i%3)*10);yay('Spa delicioso!')}]]);
/* DORMIR */
var dS=0;function dR(){dS=0;$('dark').style.opacity=0}
addZ('st-dormir',[[21,84,17,13,function(){if(dS!==0)return;dS=1;fx('st-dormir','🛏️',45,55);pop()}],[41,84,19,13,function(){if(dS!==1)return;dS=2;$('dark').style.opacity=.75;tone(400,.4);tone(300,.5,'sine',.4)}],[61,84,18,13,function(){if(dS!==2)return;dS=3;for(var i=0;i<4;i++)fx('st-dormir','💤',40+i*6,30+i*6);for(var j=0;j<3;j++)fx('st-dormir','⭐',20+j*25,15);yay('Boa noite, docinho!')}]]);
/* COLORIR (desenha por cima com o giz escolhido) */
var ccv=$('ccv'),cx2=ccv.getContext('2d'),ccol='#e63946',cdr=false;
function csize(){ccv.width=ccv.clientWidth;ccv.height=ccv.clientHeight}
addZ('st-colorir',[[29,78,7,13,function(){ccol='#e63946';pop()}],[36.5,78,7,13,function(){ccol='#1d7fe0';pop()}],[44,78,7,13,function(){ccol='#ffcc00';pop()}],[51,78,7,13,function(){ccol='#2a9d3a';pop()}],[58,78,7,13,function(){ccol='#f472b6';pop()}],[65.5,78,7,13,function(){cx2.clearRect(0,0,ccv.width,ccv.height);pop()}]]);
ccv.addEventListener('pointerdown',function(e){cdr=true;var r=ccv.getBoundingClientRect();cx2.strokeStyle=ccol;cx2.lineWidth=8;cx2.lineCap='round';cx2.beginPath();cx2.moveTo(e.clientX-r.left,e.clientY-r.top);cx2.lineTo(e.clientX-r.left+1,e.clientY-r.top);cx2.stroke()});
ccv.addEventListener('pointermove',function(e){if(!cdr)return;var r=ccv.getBoundingClientRect();cx2.lineTo(e.clientX-r.left,e.clientY-r.top);cx2.stroke()});
ccv.addEventListener('pointerup',function(){cdr=false});
/* SONS */
var ON=['Au! Au!','Miau!','Loro! Loro!','Pum-pum!','Squec!','Bem devagar...'];
addZ('st-sons',[[30,26,18,18,function(){q(0)}],[52,26,18,18,function(){q(1)}],[30,51,18,18,function(){q(2)}],[52,51,18,18,function(){q(3)}],[30,75,18,18,function(){q(4)}],[52,75,18,18,function(){q(5)}]]);
function q(i){snd(i);var b=$('bub');b.textContent=ON[i];b.style.display='block';clearTimeout(b.t);b.t=setTimeout(function(){b.style.display='none'},1200);for(var j=0;j<3;j++)fx('st-sons','🎵',35+j*12,20+i*25)}
/* LIGA PONTOS */
var lcv=$('lcv'),lx=lcv.getContext('2d'),lPts=[[37,36],[59,28],[56,47],[41,53],[61,53],[66,68],[39,71],[50,78]],lN=0;
function lsize(){lcv.width=lcv.clientWidth;lcv.height=lcv.clientHeight;lN=0;lx.clearRect(0,0,lcv.width,lcv.height);document.querySelectorAll('#st-liga .dot').forEach(function(d){d.remove()});
lPts.forEach(function(p,i){var d=document.createElement('button');d.className='dot';d.style.left=(p[0]-4)+'%';d.style.top=(p[1]-7)+'%';d.textContent=i+1;d.onclick=function(){if(i!==lN){tone(200,.15);return}d.classList.add('ok');if(lN>0){var a=lPts[lN-1],b=lPts[i];lx.strokeStyle='#7a4b2a';lx.lineWidth=5;lx.beginPath();lx.moveTo(a[0]/100*lcv.width,a[1]/100*lcv.height);lx.lineTo(b[0]/100*lcv.width,b[1]/100*lcv.height);lx.stroke()}lN++;pop();if(lN===8){for(var k=0;k<5;k++)fx('st-liga','🌟',25+k*12,25);yay('Você ligou tudo!')}};$('st-liga').appendChild(d)})}
function lR(){requestAnimationFrame(lsize)}
document.addEventListener('pointerdown',function(){if(mOn&&!mT){mN=ac().currentTime+.1;mT=setInterval(sch,200)}},{once:true});
</script>
</body>
</html>
