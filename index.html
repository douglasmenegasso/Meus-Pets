<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<meta name="theme-color" content="#ff8fb1"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<title>Meus Pets</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{height:100%;overflow:hidden}
body{font-family:"Comic Sans MS","Comic Sans",cursive;background:linear-gradient(160deg,#ffd6e8 0%,#fff6b8 30%,#c9f2dc 55%,#cfe8ff 78%,#e7d7ff 100%);touch-action:manipulation}
.screen{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;overflow-y:auto;padding:12px}
.screen.active{display:flex}
.act{padding-top:64px}
.title{font-size:1.9em;font-weight:bold;margin:4px 0 10px;text-align:center}
.title span{text-shadow:2px 2px 0 #fff,-2px 2px 0 #fff,2px -2px 0 #fff,-2px -2px 0 #fff}
.homebtn{position:fixed;top:12px;left:12px;font-size:1.4em;border:3px solid #fff;border-radius:50%;width:54px;height:54px;background:#ff9d5c;z-index:50;cursor:pointer}
#mus{position:fixed;top:12px;right:12px;left:auto;background:#7ed957}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;width:100%;max-width:430px;padding:6px}
.btn{border:4px solid #fff;border-radius:22px;padding:14px 8px;font-family:inherit;font-size:1.1em;font-weight:bold;color:#444;box-shadow:0 5px 0 rgba(0,0,0,.18);display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer}
.btn:active{transform:scale(.93)}
.btn .e{font-size:1.5em}
.pets{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:100%;max-width:480px}
.pet{background:#fff;border:4px solid #ffd23e;border-radius:20px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;font-family:inherit;font-weight:bold;color:#666;font-size:1em;cursor:pointer}
.pet svg{width:80px;height:76px}
.pet:active{transform:scale(.93)}
.scene{position:relative;width:min(94vw,440px);height:46vh;background:rgba(255,255,255,.55);border-radius:24px;border:4px solid #fff;overflow:hidden;transition:background 1s}
.scene.dark{background:#31406e}
.tools{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;justify-content:center;max-width:460px}
.tool{font-size:.95em;padding:10px 12px;border-radius:18px;border:4px solid #fff;background:#e8e8e8;font-family:inherit;font-weight:bold;color:#555;box-shadow:0 4px 0 rgba(0,0,0,.2);cursor:pointer}
.tool:active{transform:scale(.93)}
.tool.on{background:#ffe066;animation:pulse 1s infinite}
.tool.dim{opacity:.45;filter:grayscale(1)}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.wig{animation:wig .3s}.hop{animation:hop .7s}
@keyframes wig{25%{transform:rotate(4deg)}75%{transform:rotate(-4deg)}}
@keyframes hop{30%{transform:translateY(-25px) scale(1.1)}60%{transform:translateY(0)}}
.fx{position:absolute;font-size:1.8em;pointer-events:none;z-index:9;animation:float 1.2s ease-out forwards}
@keyframes float{from{transform:translateY(0) scale(.6);opacity:1}to{transform:translateY(-80px) scale(1.4);opacity:0}}
.stars{margin-bottom:6px}.stars span{font-size:1.4em;filter:grayscale(1);opacity:.35}.stars span.lit{filter:none;opacity:1}
.tubwrap{position:absolute;bottom:3%;left:50%;transform:translateX(-50%);width:88%;height:62%}
.petzone{position:absolute;bottom:52%;left:50%;transform:translateX(-50%);width:56%;z-index:2;transition:bottom .7s,transform .7s}
.petzone.intub{bottom:26%;transform:translateX(-50%) scale(.92)}
.petzone svg{width:100%}
.water{position:absolute;bottom:9%;left:2%;width:96%;height:0%;background:linear-gradient(#9fe0ff,#3aa7e8);border-radius:0 0 40px 40px;z-index:3;opacity:.85}
.tubfront{position:absolute;bottom:0;width:100%;height:32%;background:#f06292;border-radius:18px 18px 46px 46px;z-index:4;border:4px solid #fff}
.tubfront:after{content:"🐾";position:absolute;left:50%;top:30%;transform:translateX(-50%);font-size:2em;opacity:.6}
#bfoam{position:absolute;bottom:30%;left:50%;transform:translateX(-50%) scale(0);width:70%;height:26%;background:radial-gradient(circle at 20% 60%,#fff 12px,transparent 13px),radial-gradient(circle at 45% 40%,#fff 16px,transparent 17px),radial-gradient(circle at 70% 60%,#fff 14px,transparent 15px),radial-gradient(circle at 88% 45%,#fff 10px,transparent 11px);z-index:5;transition:transform .4s,opacity .4s}
#bdirt span{position:absolute;width:20px;height:15px;background:#8a5a3b;border-radius:50%;z-index:3}
#bdrops span{position:absolute;font-size:1.4em;z-index:6}
#shower{position:absolute;top:2%;right:6%;z-index:7;text-align:center}
#shower .head{font-size:2.6em;transform:rotate(-30deg)}
.drop{position:absolute;top:44px;width:7px;height:14px;background:#7fd0f7;border-radius:5px;animation:fall .6s linear infinite}
@keyframes fall{to{transform:translateY(46vh)}}
.blanket{position:absolute;bottom:12%;left:50%;transform:translateX(-50%);width:60%;height:26%;background:repeating-linear-gradient(45deg,#ff8fb1 0 12px,#ffc2d6 12px 24px);border-radius:16px;display:none;z-index:4}
#cukes{position:absolute;top:34%;left:50%;transform:translateX(-50%);font-size:1.6em;display:none;z-index:5;letter-spacing:16px}
.pal{width:46px;height:46px;border-radius:50%;border:4px solid #fff;box-shadow:0 3px 0 rgba(0,0,0,.2);cursor:pointer}
.pal.sel{outline:4px solid #333}
.palette{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap;justify-content:center}
#colwrap svg{width:min(88vw,380px);background:#fff;border-radius:18px;border:4px solid #fff}
.part{cursor:pointer}
.canvaswrap{flex:1;width:min(94vw,520px);min-height:40vh;background:#fff;border-radius:18px;border:4px solid #fff;overflow:hidden;margin-top:6px}
#cv{width:100%;height:100%;display:block;touch-action:none}
#bubble{position:fixed;top:16%;left:50%;transform:translateX(-50%);background:#fff;border:4px solid #ffd23e;border-radius:20px;padding:10px 26px;font-size:1.5em;font-weight:bold;color:#e75480;display:none;z-index:60}
#yay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.45);z-index:99}
#yay.show{display:flex}
.yaybox{background:#fff;border-radius:28px;padding:24px 34px;text-align:center;border:5px solid #ffd23e;max-width:86vw}
.yaye{font-size:3.6em;animation:hop 1s infinite}
#yaymsg{font-size:1.3em;color:#e75480;font-weight:bold;margin:8px 0 14px}
#lgwrap{width:min(92vw,420px)}
#lgwrap svg{width:100%;background:#fff;border-radius:18px;border:4px solid #fff}
.lgdot{cursor:pointer}
.small{font-size:.95em;padding:8px 18px;margin-top:10px;background:#cfe8ff}
#menuPet svg{width:130px;height:124px}
</style>
</head>
<body>

<button class="btn" style="background:#9adcf7" onclick="go('scr-banho')"><span class="e">🛁</span>BANHO</button>

<script>
var $=function(id){return document.getElementById(id)};
var NEXT={'scr-banho':'scr-spa','scr-spa':'scr-dormir','scr-dormir':'scr-colorir','scr-colorir':'scr-desenhar','scr-desenhar':'scr-sons','scr-sons':'scr-liga'};
function show(id){document.querySelectorAll('.screen').forEach(function(s){s.classList.remove('active')});$(id).classList.add('active')}
function go(id){show(id);
if(id==='scr-banho')banhoReset();
if(id==='scr-spa')spaReset();
if(id==='scr-dormir')dormirReset();
if(id==='scr-colorir')colorReset();
if(id==='scr-desenhar')requestAnimationFrame(sizeCv);
if(id==='scr-liga')lgLoad(lgIdx)}
/* ========== ÁUDIO ========== */
var AC;function ac(){AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC}
function tone(f,d,type,t,vol){d=d||.15;type=type||'sine';t=t||0;vol=vol||.3;var a=ac(),o=a.createOscillator(),g=a.createGain(),n=a.currentTime+t;o.type=type;o.frequency.value=f;o.connect(g);g.connect(a.destination);g.gain.setValueAtTime(0,n);g.gain.linearRampToValueAtTime(vol,n+.02);g.gain.exponentialRampToValueAtTime(.001,n+d);o.start(n);o.stop(n+d+.05)}
function sweep(f1,f2,d,type,t){var a=ac(),o=a.createOscillator(),g=a.createGain(),n=a.currentTime+(t||0);o.type=type||'sine';o.frequency.setValueAtTime(f1,n);o.frequency.linearRampToValueAtTime(f2,n+d);o.connect(g);g.connect(a.destination);g.gain.setValueAtTime(.3,n);g.gain.exponentialRampToValueAtTime(.001,n+d);o.start(n);o.stop(n+d+.05)}
var nbuf;function noise(d,fq,vol,type){var a=ac();if(!nbuf){nbuf=a.createBuffer(1,a.sampleRate,a.sampleRate);var ch=nbuf.getChannelData(0);for(var i=0;i<ch.length;i++)ch[i]=Math.random()*2-1}
var s=a.createBufferSource();s.buffer=nbuf;var f=a.createBiquadFilter();f.type=type||'lowpass';f.frequency.value=fq;var g=a.createGain(),n=a.currentTime;g.gain.setValueAtTime(vol,n);g.gain.exponentialRampToValueAtTime(.001,n+d);s.connect(f);f.connect(g);g.connect(a.destination);s.start(n);s.stop(n+d)}
function noiseLoop(fq,vol){var a=ac();if(!nbuf){nbuf=a.createBuffer(1,a.sampleRate,a.sampleRate);var ch=nbuf.getChannelData(0);for(var i=0;i<ch.length;i++)ch[i]=Math.random()*2-1}
var s=a.createBufferSource();s.buffer=nbuf;s.loop=true;var f=a.createBiquadFilter();f.type='lowpass';f.frequency.value=fq;var g=a.createGain();g.gain.value=vol;s.connect(f);f.connect(g);g.connect(a.destination);s.start();
return function(){g.gain.setTargetAtTime(0,a.currentTime,.08);setTimeout(function(){s.stop()},400)}}
function pop(){tone(600,.08,'triangle')}
function cheer(){[523,659,784,1047].forEach(function(f,i){tone(f,.2,'triangle',i*.12)})}
function wrong(id){var b=$(id);b.classList.remove('wig');void b.offsetWidth;b.classList.add('wig');tone(200,.15)}
/* ========== MÚSICA ========== */
var musicOn=true,mTimer=null,mIdx=0,mNext=0;
var TUNE=[[330,.3],[330,.3],[349,.3],[392,.3],[392,.3],[349,.3],[330,.3],[294,.3],[262,.3],[262,.3],[294,.3],[330,.3],[330,.45],[294,.15],[294,.6],[330,.3],[330,.3],[349,.3],[392,.3],[392,.3],[349,.3],[330,.3],[294,.3],[262,.3],[262,.3],[294,.3],[330,.3],[294,.45],[262,.15],[262,.6]];
function sched(){var a=ac();while(mNext<a.currentTime+.6){var n=TUNE[mIdx%TUNE.length];tone(n[0],n[1]*.9,'triangle',mNext-a.currentTime,.1);mNext+=n[1];mIdx++}}
function startMus(){if(mTimer||!musicOn)return;mNext=ac().currentTime+.1;mTimer=setInterval(sched,200)}
function stopMus(){clearInterval(mTimer);mTimer=null}
function toggleMus(){musicOn=!musicOn;$('mus').textContent=musicOn?'🔊':'';if(musicOn)startMus();else stopMus()}
/* ========== PETS (desenho) ========== */
var COL={dog:{b:'#c98850',d:'#9c6a38',l:'#f6e3cb'},cat:{b:'#f2f2f2',d:'#d8d8d8',l:'#ffffff'},rab:{b:'#e6c39a',d:'#d1a878',l:'#fdf3e3'},ham:{b:'#e8a05c',d:'#c77f3a',l:'#fdebd0'},par:{b:'#e85c5c',d:'#43a047',l:'#ffe08a'},tur:{b:'#8bc34a',d:'#5d9c46',l:'#dcedc8'}};
var PETS=[{id:'dog',n:'Cachorro'},{id:'cat',n:'Gato'},{id:'rab',n:'Coelho'},{id:'ham',n:'Hamster'},{id:'par',n:'Papagaio'},{id:'tur',n:'Tartaruga'}];
var ONS=['Au! Au!','Miau!','Pum-pum!','Squec!','Loro! Loro!','Bem devagar...'];
var pet=0;
function petSVG(t,o){o=o||{};var c=COL[t];var sk=o.color?' stroke="#888" stroke-width="3"':'';
function P(f){return o.color?' fill="#ffffff" class="part"'+sk:' fill="'+f+'"'}
var ears='',extra='';
if(t==='dog')ears='<ellipse cx="52" cy="62" rx="17" ry="32" transform="rotate(22 52 62)"'+P(c.d)+'/><ellipse cx="148" cy="62" rx="17" ry="32" transform="rotate(-22 148 62)"'+P(c.d)+'/>';
if(t==='cat')ears='<path d="M58 48 L48 10 L86 30 Z"'+P(c.b)+'/><path d="M142 48 L152 10 L114 30 Z"'+P(c.b)+'/><path d="M60 40 L54 20 L78 32 Z" fill="#f9b"/><path d="M140 40 L146 20 L122 32 Z" fill="#f9b"/>';
if(t==='rab')ears='<ellipse cx="72" cy="26" rx="13" ry="34"'+P(c.b)+'/><ellipse cx="72" cy="28" rx="6" ry="24" fill="#f9b"/><ellipse cx="128" cy="26" rx="13" ry="34"'+P(c.b)+'/><ellipse cx="128" cy="28" rx="6" ry="24" fill="#f9b"/>';
if(t==='ham')ears='<circle cx="62" cy="42" r="13"'+P(c.b)+'/><circle cx="62" cy="42" r="6" fill="#f9b"/><circle cx="138" cy="42" r="13"'+P(c.b)+'/><circle cx="138" cy="42" r="6" fill="#f9b"/>';
if(t==='par')ears='<ellipse cx="88" cy="26" rx="8" ry="16" transform="rotate(-15 88 26)" fill="#4cc9f0"/><ellipse cx="102" cy="22" rx="8" ry="18" fill="#43a047"/><ellipse cx="116" cy="26" rx="8" ry="16" transform="rotate(15 116 26)" fill="#ffd23e"/>';
if(t==='tur')extra='<ellipse cx="100" cy="150" rx="52" ry="34" fill="'+c.d+'"/><circle cx="82" cy="142" r="8" fill="'+c.l+'"/><circle cx="105" cy="152" r="8" fill="'+c.l+'"/><circle cx="122" cy="140" r="7" fill="'+c.l+'"/>';
var eyes=o.closed?'<path d="M66 80 q12 10 24 0" stroke="#444" stroke-width="4" fill="none" stroke-linecap="round"/><path d="M110 80 q12 10 24 0" stroke="#444" stroke-width="4" fill="none" stroke-linecap="round"/>'
:'<g><circle cx="78" cy="80" r="13" fill="#fff"/><circle cx="78" cy="80" r="9" fill="#6b4423"/><circle cx="78" cy="80" r="4.5" fill="#222"/><circle cx="74" cy="75" r="3.2" fill="#fff"/><circle cx="82" cy="84" r="1.6" fill="#fff" opacity=".8"/></g><g><circle cx="122" cy="80" r="13" fill="#fff"/><circle cx="122" cy="80" r="9" fill="#6b4423"/><circle cx="122" cy="80" r="4.5" fill="#222"/><circle cx="118" cy="75" r="3.2" fill="#fff"/><circle cx="126" cy="84" r="1.6" fill="#fff" opacity=".8"/></g>';
var nose=t==='par'?'<path d="M96 88 q16 2 12 16 q-4 10 -14 4 z" fill="#ffcc33"/>':'<ellipse cx="100" cy="94" rx="7" ry="5" fill="#444"/>';
var mouth=o.sad?'<path d="M90 110 q10 -8 20 0" stroke="#444" stroke-width="3" fill="none" stroke-linecap="round"/>':'<path d="M88 104 q12 12 24 0" stroke="#444" stroke-width="3" fill="none" stroke-linecap="round"/><ellipse cx="100" cy="113" rx="7" ry="5" fill="#f77"/>';
var dirt=o.dirty?'<ellipse cx="70" cy="58" rx="9" ry="7" fill="#8a5a3b" opacity=".7"/><ellipse cx="128" cy="66" rx="7" ry="6" fill="#8a5a3b" opacity=".7"/>':'';
var acc='';
if(o.acc==='bow')acc='<g transform="translate(142,38)"><path d="M0 0 L-20 -12 L-20 12 Z" fill="#ff5d8f"/><path d="M0 0 L20 -12 L20 12 Z" fill="#ff5d8f"/><circle r="6" fill="#d6336c"/></g>';

window.addEventListener('resize',sizeCv);
function pt(e){var r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
function seg(s,i){ctx.strokeStyle=s.color;ctx.lineWidth=6;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(s.pts[i].x,s.pts[i].y);ctx.lineTo(s.pts[i+1].x,s.pts[i+1].y);ctx.stroke()}
function tracePts(k){var w=cv.width,h=cv.height,cx=w/2,cy=h/2,R=Math.min(w,h)*.35,P=[];
if(k==='circle'){for(var i=0;i<24;i++){var a=i/24*Math.PI*2;P.push({x:cx+R*Math.cos(a),y:cy+R*Math.sin(a)})}}
if(k==='star'){[[100,15],[125,75],[190,80],[140,120],[158,185],[100,148],[42,185],[60,120],[10,80],[75,75]].forEach(function(p){P.push({x:p[0]/200*w,y:p[1]/200*h})})}
if(k==='heart'){for(var j=0;j<=24;j++){var t=j/24*Math.PI*2,x=16*Math.pow(Math.sin(t),3),y=13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t);P.push({x:cx+x*R/16,y:cy-y*R/16})}}
return P}
function redraw(){ctx.clearRect(0,0,cv.width,cv.height);
if(trace){var P=tracePts(trace);ctx.save();ctx.strokeStyle='#bbb';ctx.lineWidth=3;ctx.setLineDash([10,10]);ctx.beginPath();P.forEach(function(p,i){i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y)});ctx.closePath();ctx.stroke();ctx.restore()}
strokes.forEach(function(s){for(var i=0;i<s.pts.length-1;i++)seg(s,i)})}
cv.addEventListener('pointerdown',function(e){drawing=true;var p=pt(e);cur={color:curColor,pts:[p,p]};strokes.push(cur);cv.setPointerCapture(e.pointerId);seg(cur,0)});
cv.addEventListener('pointermove',function(e){if(!drawing)return;cur.pts.push(pt(e));seg(cur,cur.pts.length-2)});
cv.addEventListener('pointerup',function(){drawing=false});
